name: Increment Version on PR

on:
  pull_request:
    types: [opened]
    branches:
      - 'app/**'  # Action s'exécute pour les PR depuis toute branche commençant par app/
      
permissions:
  contents: write
  pull-requests: write
  
jobs:
  increment-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      
      - name: Increment Patch Version
        run: |
          # Vérifier si le pom.xml existe
          if [ ! -f "pom.xml" ]; then
            echo "Fichier pom.xml non trouvé"
            exit 1
          fi
          
          # Extraire la version actuelle du pom.xml
          CURRENT_VERSION=$(grep -m 1 "<version>" pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "Version actuelle: $CURRENT_VERSION"
          
          # Décomposer la version
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3 | cut -d- -f1)
          
          # Incrémenter le patch
          NEW_PATCH=$((PATCH + 1))
          
          # Construire la nouvelle version
          if [[ $CURRENT_VERSION == *-* ]]; then
            # Préserver le suffixe comme -SNAPSHOT
            SUFFIX=$(echo $CURRENT_VERSION | grep -o -- "-.*")
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH$SUFFIX"
          else
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          fi
          
          echo "Nouvelle version: $NEW_VERSION"
          
          # Remplacer la première occurrence de la balise version dans le pom.xml
          sed -i "0,/<version>$CURRENT_VERSION<\/version>/s//<version>$NEW_VERSION<\/version>/" pom.xml
          
          echo "Version mise à jour dans pom.xml"
          
          # Vérification
          grep -m 1 "<version>" pom.xml || echo "Vérification échouée"
          
          # Définir la nouvelle version comme variable d'environnement pour l'étape suivante
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
      
      - name: Commit changes
        run: |
          git add pom.xml
          git commit -m "Increment version patch to ${{ env.NEW_VERSION }}"
          
      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
